<svg xmlns="http://www.w3.org/2000/svg" xmlns:tscaps="https://tscaps.io/filters">
  <defs>
    <!--
      A dark ring around each word. It sits on the word, not on the
      segment, so the emoji above the caption stay out of it: they are
      drawn by the device's emoji font, and Windows 10's already rings
      each one in dark ink, so a second ring read as a heavy black
      border there.

      The region reaches one word-width past each side and half the
      word's height above and below, room for the thickest ring around a
      one-letter word.
    -->
    <filter id="glitch-outline" x="-100%" y="-50%" width="300%" height="200%" color-interpolation-filters="sRGB">
      <tscaps:outline thickness="var(--tscaps-outline-thickness, 0.08)"
                      ink="var(--tscaps-outline-color, #0a0a0a)"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!--
      One variant, driven by a per-frame tick. The renderer's filter
      provider rebuilds the materialized body every output tile, and
      `tscaps-tick-60` resolves to a fresh integer 60 times per second.
      Feeding it into `feTurbulence seed` gives the noise pattern
      genuine per-frame variation — no keyframe cycling between
      pre-baked variants needed.

      Pipeline:
       1. Anisotropic turbulence (X coherent, Y fragmented).
       2. Quantize the R channel into a few discrete levels so the
          horizontal displacement clusters into block-like bands
          instead of smooth waves.
       3. Force the G channel to a constant so the displacement
          stays purely horizontal — no vertical jitter.
       4. Displace both the source graphic and its alpha by the same
          noise; build colored RGB-split ghosts from the displaced
          alpha via the chromatic-split recipe and stack them BEHIND
          the source via feMerge. Source and outline stay on top
          untouched; ghosts only show in the fringe areas where their
          offset extends past the source silhouette.
    -->
    <filter id="glitch" x="-20%" y="-15%" width="140%" height="130%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.02 var(--tscaps-displacement-frequency, 0.75)"
        numOctaves="2"
        seed="var(--tscaps-tick-60, 1)"
        result="rawNoise"
      />
      <feComponentTransfer in="rawNoise" result="noise">
        <feFuncR type="discrete" tableValues="0 0.35 0.65 1"/>
        <feFuncG type="linear" slope="0" intercept="0.5"/>
      </feComponentTransfer>

      <feDisplacementMap in="SourceGraphic" in2="noise" scale="var(--tscaps-displacement-amount, 9)" xChannelSelector="R" yChannelSelector="G" result="displacedSrc"/>
      <feDisplacementMap in="SourceAlpha" in2="noise" scale="var(--tscaps-displacement-amount, 9)" xChannelSelector="R" yChannelSelector="G" result="displacedAlpha"/>

      <tscaps:chromatic-split x="var(--tscaps-split-x, 0.05)"
                              color-a="var(--tscaps-split-color-a, #ff0044)"
                              color-b="var(--tscaps-split-color-b, #00f4ff)"
                              in="displacedAlpha"/>

      <feMerge>
        <feMergeNode in="split-a"/>
        <feMergeNode in="split-b"/>
        <feMergeNode in="displacedSrc"/>
      </feMerge>
    </filter>
  </defs>
</svg>
