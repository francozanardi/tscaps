<svg xmlns="http://www.w3.org/2000/svg" xmlns:tscaps="https://tscaps.io/filters">
  <defs>
    <!--
      A black ring around each word. It sits on the word, not on the
      segment: Safari paints a word whose pop is running on a layer of
      its own and leaves it out of its ancestors' filters, so a filter
      on the segment dropped the ring from the very word being said. On
      the word the ring scales with the pop, and at the default spacing
      the rings of two neighbours meet without reaching either's letters.

      The emoji above the caption stay out of it. They are drawn by the
      device's emoji font, and Windows 10's already rings each one in
      dark ink, so a second ring read as a heavy black border there.

      The region reaches one word-width past each side and half the
      word's height above and below, room for the thickest ring around a
      one-letter word.
    -->
    <filter id="hype-outline" x="-100%" y="-50%" width="300%" height="200%" color-interpolation-filters="sRGB">
      <tscaps:outline thickness="var(--tscaps-outline-thickness, 0.14)"
                      ink="var(--tscaps-outline-color, #000000)"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
